name: Build app Windows

# Lưu ý: nút "Run workflow" (workflow_dispatch) chỉ hiện trên GitHub khi file
# này đã có ở nhánh mặc định (main). Trong lúc còn phát triển ở nhánh riêng,
# dùng trigger push bên dưới để build tự động mỗi lần đẩy code lên.
on:
  workflow_dispatch:
  push:
    branches:
      - build-windows
    tags:
      - "v*"

jobs:
  build:
    # Bắt buộc chạy trên Windows: PyInstaller không build chéo hệ điều hành,
    # build trên máy Mac/Linux chỉ ra file chạy cho Mac/Linux.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Không chạy 'playwright install chromium': tool dùng Google Chrome cài
      # sẵn trên máy người dùng, không dùng Chromium của Playwright.
      # Xem giải thích trong build_windows.spec.

      - name: Đóng gói
        run: pyinstaller build_windows.spec

      - name: Kiểm tra gói có đủ thành phần
        # Thiếu file thì PyInstaller vẫn build xanh bình thường, chỉ lộ ra khi
        # người dùng bấm "Thêm nick". Kiểm tra ngay ở đây cho chắc.
        shell: pwsh
        run: |
          $dist = "dist\ToolDangBaiFacebook"
          foreach ($f in @("ToolDangBaiFacebook.exe", "_internal\playwright\driver\node.exe")) {
            if (-not (Test-Path (Join-Path $dist $f))) {
              Write-Error "Thieu file trong goi: $f"
              exit 1
            }
          }
          $mb = [math]::Round((Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB)
          Write-Host "OK - day du thanh phan. Tong dung luong: $mb MB"

      - name: Kèm hướng dẫn sử dụng vào thư mục kết quả
        run: copy HUONGDAN_NGUOI_DUNG.md dist\ToolDangBaiFacebook\

      - name: Tải kết quả lên
        uses: actions/upload-artifact@v4
        with:
          name: ToolDangBaiFacebook-Windows
          path: dist/ToolDangBaiFacebook/
